plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'Spring Modulith application bundling the Cart and Order modules'

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
        mavenBom "org.jmolecules:jmolecules-bom:${jmoleculesBomVersion}"
    }
}

// Only the executable bootJar is needed for this deployable; skip the plain jar.
tasks.named('jar') {
    enabled = false
}

dependencies {
    implementation project(':events-contract')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.modulith:spring-modulith-starter-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    runtimeOnly 'org.springframework.modulith:spring-modulith-events-kafka'

    implementation 'org.jmolecules:jmolecules-ddd'
    implementation 'org.jmolecules:jmolecules-events'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testRuntimeOnly 'com.h2database:h2'
}
